name: todo-api

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todo-api-sql
    hostname: db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Evaluation"
    networks:
      - app-network
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__DefaultConnection: "${DEFAULT_CONNECTION}"
      JWT__Key: "${JWT_SECRET}"
      JWT__Issuer: "${JWT_ISSUER}"
      JWT__Audience: "${JWT_AUDIENCE}"
      JWT__AccessTokenExpiry: "${JWT_ACCESS_TOKEN_EXPIRY}"
      JWT__RefreshTokenExpiry: "${JWT_REFRESH_TOKEN_EXPIRY}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN}"
      Database__ApplyMigrationsOnStartup: "${APPLY_MIGRATIONS_ON_STARTUP:-false}"
    depends_on:
      - db
    networks:
      - app-network
    restart: always

networks:
  app-network:
